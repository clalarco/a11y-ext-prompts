name: release-prompts

on:
  push:
    branches: [main]

jobs:
  bundle-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate bundle
        run: npm run bundle

      - name: Arrange assets into subfolders
        run: |
          mkdir -p release-assets/prompts release-assets/sites
          cp dist/prompts.json release-assets/prompts/prompts.json
          cp dist/sites/generic.json release-assets/prompts/generic.json
          # Solo los sitios (excluye generic, que va en prompts/)
          for f in dist/sites/*.json; do
            [ "$(basename "$f")" = "generic.json" ] && continue
            cp "$f" release-assets/sites/
          done

      - name: Create zip bundle (markdown-like layout)
        run: |
          # Replica la estructura de directorios de prompts/ (generic + sites)
          # agrupando los JSON igual que los markdown de origen.
          mkdir -p zip-build/prompts/prompts/sites zip-build/prompts/prompts/generic
          cp dist/prompts.json zip-build/prompts/prompts.json
          cp dist/sites/generic.json zip-build/prompts/prompts/generic/generic.json
          for f in dist/sites/*.json; do
            [ "$(basename "$f")" = "generic.json" ] && continue
            cp "$f" zip-build/prompts/prompts/sites/
          done
          cd zip-build && zip -r ../release-assets/prompts.zip prompts

      - name: Set timestamp tag
        id: ts
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ts.outputs.tag }}
          name: "Prompts ${{ steps.ts.outputs.tag }}"
          files: |
            release-assets/prompts/prompts.json
            release-assets/prompts/generic.json
            release-assets/prompts.zip
            release-assets/sites/*.json
          generate_release_notes: true
